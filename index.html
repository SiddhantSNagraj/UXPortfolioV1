<style>
  /* ░░ Intro / loading masthead ░░ */
  #intro {
    position: fixed; inset: 0; z-index: 100000; background: #0b0b0c;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; font-family: 'Gambetta', Georgia, serif;
    opacity: 1; transition: opacity .8s cubic-bezier(.4,0,.2,1);
    /* no-JS / JS-failure safety net: fade away on its own after 9s */
    animation: introFail 1s linear 9s forwards;
  }
  #intro.is-done { opacity: 0; pointer-events: none; }
  @keyframes introFail { to { opacity: 0; visibility: hidden; } }

  #intro .intro__bar { position: absolute; left: 0; right: 0; color: #f7c14a; display: block; }
  #intro .intro__bar--top { top: 30px; }
  #intro .intro__bar--bot { bottom: 30px; transform: scaleY(-1); }

  #intro .intro__plate { text-align: center; max-width: min(900px, 86vw); padding: 0 24px; }
  #intro .intro__rule { height: 1px; background: rgba(255,255,255,.22); }
  #intro .intro__kicker {
    font-family: 'General Sans', system-ui, sans-serif; font-size: 11px; font-weight: 500;
    letter-spacing: .32em; text-transform: uppercase; color: #75746f; margin: 17px 0;
  }
  #intro .intro__name {
    font-size: clamp(32px, 5.6vw, 66px); font-weight: 500; color: #f2f1ec;
    letter-spacing: -.01em; line-height: 1; margin: 0 0 17px;
  }
  #intro .intro__name em { font-style: italic; color: #f7c14a; }
  #intro .intro__how {

  <script>
  (function () {
    var intro = document.getElementById('intro');
    if (!intro) return;
    // returning within the same session: skip instantly (no flash)
    try { if (sessionStorage.getItem('sn-intro-seen')) { intro.parentNode.removeChild(intro); return; } } catch (e) {}

    var greetEl = intro.querySelector('.intro__greet');
    var greets = ['\u0915\u0938\u0947 \u0906\u0939\u093e\u0924?', '\u5143\u6c17\u3067\u3059\u304b\uff1f', '\u00bfC\u00f3mo est\u00e1s?', 'How are you?'];
    var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var i = 0, cyc = null;
    greetEl.textContent = greets[0];
    if (!rm) {
      cyc = setInterval(function () {
        greetEl.style.opacity = '0'; greetEl.style.transform = 'translateY(7px)';
        setTimeout(function () {
          i = (i + 1) % greets.length; greetEl.textContent = greets[i];
          greetEl.style.opacity = '1'; greetEl.style.transform = 'none';
        }, 340);
      }, 780);
    }

    var done = false, start = Date.now(), minTime = rm ? 600 : 2700;
    function finish() {
      if (done) return; done = true;
      if (cyc) clearInterval(cyc);
      try { sessionStorage.setItem('sn-intro-seen', '1'); } catch (e) {}
      intro.classList.add('is-done');
      setTimeout(function () { if (intro.parentNode) intro.parentNode.removeChild(intro); }, 850);
    }
    ['click', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
      window.addEventListener(ev, finish, { once: true, passive: true });
    });
    function appReady() { var r = document.getElementById('root'); return r && r.children.length > 0; }
    function tick() {
      if (appReady() && Date.now() - start >= minTime) finish();
      else if (Date.now() - start > 12000) finish();   // hard cap
      else requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
  </script>
