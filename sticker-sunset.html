<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="design_doc_mode" content="canvas" />
<title>Sunset Press — refined + badge lockups</title>
<link rel="preconnect" href="https://api.fontshare.com" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=clash-display@600,700&display=swap" />
<style>
  :root { --bg:#0b0b0c; --ink:#f2f1ec; --ink-2:#b9b8b2; --ink-3:#75746f; --yellow:#f7c14a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'General Sans', system-ui, sans-serif; background: #e8e6df; color: var(--ink); }
  .panel { position: absolute; width: 680px; height: 1400px; background: var(--bg); border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.16); }
  .panel__head { position: absolute; top: 30px; left: 34px; right: 34px; z-index: 10; }
  .panel__idx { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--yellow); }
  .panel__name { font-family: 'Clash Display', sans-serif; font-weight: 700; font-size: 28px; color: var(--ink); margin-top: 4px; }
  .panel__desc { font-size: 13px; line-height: 1.5; color: var(--ink-3); margin-top: 6px; }
  .slots { position: absolute; inset: 150px 0 26px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 30px; padding-top: 6px; }
  .stk { filter: drop-shadow(0 9px 13px rgba(0,0,0,.42)); }
  .stk svg { display: block; }
</style>
</head>
<body>
<div class="panel" style="left:40px; top:40px;">
  <div class="panel__head">
    <div class="panel__idx">Direction 1</div>
    <div class="panel__name">Sunset Press · refined</div>
    <div class="panel__desc">Offset-type style, four distinct shapes — circle · blob · pill · scalloped seal.</div>
  </div>
  <div class="slots" id="col1"></div>
</div>
<div class="panel" style="left:760px; top:40px;">
  <div class="panel__head">
    <div class="panel__idx">Direction 2</div>
    <div class="panel__name">Badge lockups</div>
    <div class="panel__desc">Monoline crew-badge style from your new reference — object die-cut · lens band · arch · tall oval.</div>
  </div>
  <div class="slots" id="col2"></div>
</div>

<script>
  const C = { cream:'#f4ecdd', yellow:'#f7c14a', blue:'#2b6fff', black:'#14140f', burnt:'#dd5a34' };
  let uid = 0;

  function ast(x, y, color, sz) {
    sz = sz || 9;
    return '<g transform="translate('+x+' '+y+')" stroke="'+color+'" stroke-width="'+(sz*0.55)+'" stroke-linecap="round">' +
      '<line x1="'+(-sz)+'" y1="0" x2="'+sz+'" y2="0"/><line x1="0" y1="'+(-sz)+'" x2="0" y2="'+sz+'"/>' +
      '<line x1="'+(-sz*0.7)+'" y1="'+(-sz*0.7)+'" x2="'+(sz*0.7)+'" y2="'+(sz*0.7)+'"/><line x1="'+(-sz*0.7)+'" y1="'+(sz*0.7)+'" x2="'+(sz*0.7)+'" y2="'+(-sz*0.7)+'"/></g>';
  }
  function wrap(rot, svg) { return '<div class="stk" style="transform:rotate('+rot+'deg)">'+svg+'</div>'; }

  /* ============ DIRECTION 1 — SUNSET PRESS, REFINED ============ */

  // circle w/ proper top + bottom arcs (bottom reads upright)
  function circleStk(o) {
    const s=252, r=s/2, cx=r, cy=r, tr=r-38, idT='t'+(uid++), idB='b'+(uid++);
    return wrap(o.rot, '<svg width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'">' +
      '<defs>' +
        '<path id="'+idT+'" fill="none" d="M '+(cx-tr)+' '+cy+' A '+tr+' '+tr+' 0 0 1 '+(cx+tr)+' '+cy+'"/>' +
        '<path id="'+idB+'" fill="none" d="M '+(cx-tr+8)+' '+cy+' A '+(tr-8)+' '+(tr-8)+' 0 0 0 '+(cx+tr-8)+' '+cy+'"/>' +
      '</defs>' +
      '<circle cx="'+(cx+9)+'" cy="'+(cy+11)+'" r="'+(r-10)+'" fill="'+o.offset+'"/>' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-10)+'" fill="'+o.fill+'" stroke="'+C.cream+'" stroke-width="9" paint-order="stroke"/>' +
      '<g transform="translate('+cx+' '+(cy+2)+')" stroke="'+o.text+'" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M -20 -16 v-6 h6 M 14 -22 h6 v6 M 20 14 v6 h-6 M -14 20 h-6 v-6"/>' +
        '<path d="M -6 -6 L 12 2 L 4 5 L 9 13 L 5 15 L 1 8 L -6 12 Z" fill="'+o.text+'"/></g>' +
      '<text font-family="Clash Display" font-weight="700" font-size="21" letter-spacing="1" fill="'+o.text+'"><textPath href="#'+idT+'" startOffset="50%" text-anchor="middle">PIXEL MICROMANAGER</textPath></text>' +
      '<text font-family="General Sans" font-weight="700" font-size="12" letter-spacing="3.5" fill="'+o.text+'"><textPath href="#'+idB+'" startOffset="50%" text-anchor="middle">1PX AT A TIME</textPath></text>' +
      '</svg>');
  }

  function blobStk(o) {
    const w=380, h=168, path='M 34 30 Q 190 12 346 30 Q 374 92 346 156 Q 190 176 34 156 Q 8 92 34 30 Z';
    return wrap(o.rot, '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">' +
      '<path d="'+path+'" fill="'+o.offset+'" transform="translate(11 13)"/>' +
      '<path d="'+path+'" fill="'+o.fill+'" stroke="'+C.cream+'" stroke-width="9" paint-order="stroke"/>' +
      '<text x="190" y="86" text-anchor="middle" font-family="Clash Display" font-weight="700" font-size="52" letter-spacing="-1" fill="'+o.text+'">'+o.l1+'</text>' +
      '<text x="190" y="130" text-anchor="middle" font-family="Clash Display" font-weight="700" font-size="29" fill="'+o.text+'">'+o.l2+'</text>' +
      ast(66, 54, o.dood, 10) + ast(320, 136, o.dood, 10) + '</svg>');
  }

  function pillStk(o) {
    const w=414, h=142;
    return wrap(o.rot, '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">' +
      '<rect x="14" y="14" width="'+(w-28)+'" height="'+(h-28)+'" rx="'+((h-28)/2)+'" fill="'+o.offset+'" transform="translate(11 13)"/>' +
      '<rect x="14" y="14" width="'+(w-28)+'" height="'+(h-28)+'" rx="'+((h-28)/2)+'" fill="'+o.fill+'" stroke="'+C.cream+'" stroke-width="9" paint-order="stroke"/>' +
      '<text x="'+(w/2)+'" y="66" text-anchor="middle" font-family="Clash Display" font-weight="700" font-size="33" fill="'+o.text+'">'+o.l1+'</text>' +
      '<text x="'+(w/2)+'" y="102" text-anchor="middle" font-family="Clash Display" font-weight="700" font-size="23" fill="'+o.text+'">'+o.l2+'</text>' +
      ast(56, 46, o.dood, 8) + ast(w-56, 96, o.dood, 8) + '</svg>');
  }

  function scallopPath(cx, cy, R, n, d) {
    let p = '';
    for (let i = 0; i < n; i++) {
      const a1 = (i/n)*2*Math.PI - Math.PI/2, a2 = ((i+1)/n)*2*Math.PI - Math.PI/2, am = (a1+a2)/2;
      const x1 = cx+R*Math.cos(a1), y1 = cy+R*Math.sin(a1);
      const xm = cx+(R+d)*Math.cos(am), ym = cy+(R+d)*Math.sin(am);
      const x2 = cx+R*Math.cos(a2), y2 = cy+R*Math.sin(a2);
      p += (i ? '' : 'M '+x1.toFixed(1)+' '+y1.toFixed(1)+' ') + 'Q '+xm.toFixed(1)+' '+ym.toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1)+' ';
    }
    return p + 'Z';
  }
  function scallopStk(o) {
    const s=252, cx=s/2, cy=s/2, path=scallopPath(cx, cy, 104, 12, 11);
    return wrap(o.rot, '<svg width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'">' +
      '<path d="'+scallopPath(cx+9, cy+11, 104, 12, 11)+'" fill="'+o.offset+'"/>' +
      '<path d="'+path+'" fill="'+o.fill+'"/>' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="88" fill="none" stroke="'+o.text+'" stroke-width="2" stroke-dasharray="2 6"/>' +
      '<text x="'+cx+'" y="'+(cy-16)+'" text-anchor="middle" font-family="Clash Display" font-weight="700" font-size="30" fill="'+o.text+'">CLEAN</text>' +
      '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-family="Clash Display" font-weight="700" font-size="30" fill="'+o.text+'">DESK</text>' +
      '<text x="'+cx+'" y="'+(cy+46)+'" text-anchor="middle" font-family="General Sans" font-weight="700" font-size="12.5" letter-spacing="3" fill="'+o.text+'">EVANGELIST</text>' +
      ast(cx, cy-52, o.dood, 8) + '</svg>');
  }

  document.getElementById('col1').innerHTML =
    circleStk({ fill:C.burnt, offset:C.yellow, text:C.cream, rot:-3 }) +
    blobStk({ fill:C.yellow, offset:C.burnt, text:C.black, dood:C.burnt, l1:'GYM', l2:'ENTHUSIAST', rot:2 }) +
    pillStk({ fill:C.black, offset:C.burnt, text:C.cream, dood:C.yellow, l1:'HORROR MOVIE', l2:'CONNOISSEUR', rot:-2 }) +
    scallopStk({ fill:C.cream, offset:C.blue, text:C.black, dood:C.blue, rot:3 });

  /* ============ DIRECTION 2 — MONOLINE BADGE LOCKUPS ============ */

  // 2·1 monitor die-cut (black) — "HOME TEAM" camera equivalent
  function monitorStk(o) {
    const w=262, h=236;
    const sil = 'M 46 20 H 214 A 16 16 0 0 1 230 36 V 144 A 16 16 0 0 1 214 160 H 152 L 158 186 H 172 A 8 8 0 0 1 172 202 H 88 A 8 8 0 0 1 88 186 H 102 L 108 160 H 46 A 16 16 0 0 1 30 144 V 36 A 16 16 0 0 1 46 20 Z';
    return wrap(o.rot, '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">' +
      '<path d="'+sil+'" fill="'+C.black+'" stroke="'+C.cream+'" stroke-width="9" paint-order="stroke"/>' +
      '<rect x="44" y="34" width="172" height="112" rx="9" fill="none" stroke="'+C.cream+'" stroke-width="3"/>' +
      '<text x="130" y="84" text-anchor="middle" font-family="Clash Display" font-weight="700" font-size="34" letter-spacing="1" fill="'+C.cream+'">PIXEL</text>' +
      '<text x="130" y="112" text-anchor="middle" font-family="General Sans" font-weight="700" font-size="13" letter-spacing="3" fill="'+C.cream+'">MICROMANAGER</text>' +
      '<path d="M 188 122 l 14 6 l -6 2 l 4 6 l -3 2 l -4 -6 l -4 5 Z" fill="'+C.burnt+'"/>' +
      '</svg>');
  }

  // 2·2 lens band (cream) — "THINK GLOBAL FILM LOCAL" equivalent
  function lensStk(o) {
    const w=340, h=150, idT='t'+(uid++), idB='b'+(uid++);
    const lens = 'M 20 75 Q 170 14 320 75 Q 170 136 20 75 Z';
    return wrap(o.rot, '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">' +
      '<defs>' +
        '<path id="'+idT+'" fill="none" d="M 46 76 Q 170 32 294 76"/>' +
        '<path id="'+idB+'" fill="none" d="M 52 74 Q 170 116 288 74"/>' +
      '</defs>' +
      '<path d="'+lens+'" fill="'+C.cream+'"/>' +
      '<path d="M 32 75 Q 170 22 308 75 Q 170 128 32 75 Z" fill="none" stroke="'+C.black+'" stroke-width="2.6"/>' +
      '<g stroke="'+C.black+'" stroke-width="3.4" stroke-linecap="round"><line x1="150" y1="75" x2="190" y2="75"/><line x1="150" y1="64" x2="150" y2="86"/><line x1="190" y1="64" x2="190" y2="86"/><line x1="141" y1="68" x2="141" y2="82"/><line x1="199" y1="68" x2="199" y2="82"/></g>' +
      '<text font-family="General Sans" font-weight="700" font-size="16.5" letter-spacing="3" fill="'+C.black+'"><textPath href="#'+idT+'" startOffset="50%" text-anchor="middle">GYM ENTHUSIAST</textPath></text>' +
      '<text font-family="General Sans" font-weight="700" font-size="13" letter-spacing="3" fill="'+C.black+'"><textPath href="#'+idB+'" startOffset="50%" text-anchor="middle">NO REST DAYS</textPath></text>' +
      '</svg>');
  }

  // 2·3 arch (burnt) — "HAPPY CREWS MAKE BETTER CONTENT" equivalent
  function archStk(o) {
    const w=272, h=248, idA='a'+(uid++);
    const sil = 'M 30 224 V 134 A 106 106 0 0 1 242 134 V 224 A 8 8 0 0 1 234 232 H 38 A 8 8 0 0 1 30 224 Z';
    return wrap(o.rot, '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">' +
      '<defs><path id="'+idA+'" fill="none" d="M 56 138 A 80 80 0 0 1 216 138"/></defs>' +
      '<path d="'+sil+'" fill="'+C.burnt+'" stroke="'+C.cream+'" stroke-width="9" paint-order="stroke"/>' +
      '<path d="M 44 218 V 136 A 92 92 0 0 1 228 136 V 218" fill="none" stroke="'+C.black+'" stroke-width="2.4"/>' +
      '<text font-family="Clash Display" font-weight="700" font-size="25" letter-spacing="1.5" fill="'+C.black+'"><textPath href="#'+idA+'" startOffset="50%" text-anchor="middle">HORROR MOVIE</textPath></text>' +
      '<rect x="90" y="128" width="92" height="40" rx="20" fill="'+C.cream+'"/>' +
      '<text x="136" y="155" text-anchor="middle" font-family="Clash Display" font-weight="700" font-size="21" letter-spacing="1" fill="'+C.black+'">ONLY</text>' +
      '<line x1="46" y1="188" x2="226" y2="188" stroke="'+C.black+'" stroke-width="2.4"/>' +
      '<text x="136" y="214" text-anchor="middle" font-family="General Sans" font-weight="700" font-size="15" letter-spacing="3.5" fill="'+C.black+'">CONNOISSEUR</text>' +
      '</svg>');
  }

  // 2·4 tall oval (yellow) — "GLOBAL VIEWS LOCAL CREWS" equivalent
  function ovalStk(o) {
    const w=238, h=300, cx=119, cy=150, idR='o'+(uid++);
    return wrap(o.rot, '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">' +
      '<defs><path id="'+idR+'" fill="none" d="M '+cx+' '+(cy-114)+' a 82 114 0 1 1 0 228 a 82 114 0 1 1 0 -228"/></defs>' +
      '<ellipse cx="'+cx+'" cy="'+cy+'" rx="105" ry="136" fill="'+C.yellow+'" stroke="'+C.cream+'" stroke-width="9" paint-order="stroke"/>' +
      '<ellipse cx="'+cx+'" cy="'+cy+'" rx="94" ry="125" fill="none" stroke="'+C.black+'" stroke-width="2.6"/>' +
      // rays + sparkle emblem
      '<g stroke="'+C.black+'" stroke-width="3.2" stroke-linecap="round">' +
        [-150,-120,-90,-60,-30].map(function(a){ const rad=a*Math.PI/180; return '<line x1="'+(cx+20*Math.cos(rad)).toFixed(1)+'" y1="'+(cy-8+20*Math.sin(rad)).toFixed(1)+'" x2="'+(cx+42*Math.cos(rad)).toFixed(1)+'" y2="'+(cy-8+42*Math.sin(rad)).toFixed(1)+'"/>'; }).join('') +
        '<line x1="'+(cx-34)+'" y1="'+(cy+12)+'" x2="'+(cx+34)+'" y2="'+(cy+12)+'"/>' +
      '</g>' +
      '<path d="M '+cx+' '+(cy+22)+' l 5 14 l 14 5 l -14 5 l -5 14 l -5 -14 l -14 -5 l 14 -5 Z" fill="'+C.black+'"/>' +
      '<text font-family="General Sans" font-weight="700" font-size="17" letter-spacing="3.5" fill="'+C.black+'"><textPath href="#'+idR+'" startOffset="75%" text-anchor="middle">CLEAN DESK</textPath></text>' +
      '<text font-family="General Sans" font-weight="700" font-size="17" letter-spacing="3.5" fill="'+C.black+'"><textPath href="#'+idR+'" startOffset="25%" text-anchor="middle">EVANGELIST</textPath></text>' +
      '</svg>');
  }

  document.getElementById('col2').innerHTML =
    monitorStk({ rot:-4 }) + lensStk({ rot:3 }) + archStk({ rot:-3 }) + ovalStk({ rot:4 });
</script>
</body>
</html>
