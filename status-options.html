<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Status indicator — options</title>
<link rel="preconnect" href="https://api.fontshare.com" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&f[]=gambetta@400,500,600&display=swap" />
<style>
  :root{
    --bg:#0b0b0c; --surface:#161618; --ink:#f2f1ec; --ink-2:#b9b8b2; --ink-3:#75746f; --ink-4:#4a4a47;
    --amber:#f7c14a; --green:#5fb98b;
    --mono:'General Sans',system-ui,sans-serif; --body:'Gambetta',Georgia,serif;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);padding:46px clamp(20px,5vw,70px) 100px;}
  h1{font-family:var(--body);font-weight:500;font-size:30px;margin:0 0 4px;}
  h1 em{font-style:italic;color:var(--amber);}
  .sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:40px;}
  .opt{border:1px solid rgba(255,255,255,.1);border-radius:14px;margin-bottom:18px;overflow:hidden;}
  .opt__bar{display:flex;align-items:baseline;gap:13px;padding:13px 20px;background:var(--surface);border-bottom:1px solid rgba(255,255,255,.08);}
  .opt__n{font-size:12px;color:var(--amber);letter-spacing:.12em;}
  .opt__name{font-size:15px;font-weight:600;}
  .opt__desc{font-family:var(--body);font-size:13px;color:var(--ink-2);margin-left:auto;font-style:italic;}
  /* eyebrow row context */
  .eyebrow{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;padding:26px 20px;}
  .eyebrow .mono{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);}
  .eyebrow .blue{color:#6f9be6;}
  .mono{font-family:var(--mono);}

  /* shared */
  .s{display:inline-flex;align-items:center;line-height:1;font-size:12px;letter-spacing:.04em;text-transform:uppercase;}

  /* 1 · Asterisk prefix (matches site ✳ motif) */
  .s1{gap:8px;color:var(--amber);}
  .s1::before{content:"✳︎";font-size:12px;}

  /* 2 · Registration-mark corners */
  .s2{position:relative;padding:7px 14px;color:var(--ink);letter-spacing:.14em;}
  .s2::before,.s2::after{content:"";position:absolute;width:7px;height:7px;border:1px solid var(--amber);}
  .s2::before{top:0;left:0;border-right:0;border-bottom:0;}
  .s2::after{bottom:0;right:0;border-left:0;border-top:0;}

  /* 3 · Solid sticker label */
  .s3{background:var(--amber);color:#1a1407;font-weight:600;padding:6px 12px;border-radius:5px;letter-spacing:.12em;font-size:11px;transform:rotate(-1.5deg);}

  /* 4 · Leading bar + uppercase */
  .s4{gap:11px;color:var(--ink);letter-spacing:.13em;}
  .s4::before{content:"";width:20px;height:2px;background:var(--amber);}

  /* 5 · Hollow ring (no flash) + text */
  .s5{gap:9px;color:var(--amber);}
  .s5 .ring{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--amber);flex:none;}

  /* 6 · Slash availability tag */
  .s6{gap:8px;color:var(--ink-2);letter-spacing:.1em;}
  .s6 b{color:var(--amber);font-weight:600;}

  /* 7 · Underline only */
  .s7{color:var(--ink);letter-spacing:.06em;padding-bottom:3px;background-image:linear-gradient(var(--amber),var(--amber));background-size:100% 1.5px;background-position:0 100%;background-repeat:no-repeat;}

  /* 8 · Bracket index tag */
  .s8{gap:0;color:var(--amber);letter-spacing:.16em;}
  .s8::before{content:"[ ";}.s8::after{content:" ]";}
</style>
</head>
<body>
  <h1>Status <em>indicator</em> — options</h1>
  <div class="sub">Shown in the real eyebrow row · replaces the green flashing pill</div>
  <div id="root"></div>
<script>
  const OPTS=[
    ['01','Asterisk prefix','Uses the site ✳ motif, no pill','<span class="s s1">Open to opportunities</span>'],
    ['02','Registration corners','Print-shop crop marks','<span class="s s2">Open to opportunities</span>'],
    ['03','Sticker label','Solid amber, tilted like a stamp','<span class="s s3">Open to work</span>'],
    ['04','Leading bar','A short accent rule, then caps','<span class="s s4">Open to opportunities</span>'],
    ['05','Hollow ring','A ring, not a flashing dot','<span class="s s5"><span class="ring"></span>Open to opportunities</span>'],
    ['06','Slash tag','Editorial label, year-stamped','<span class="s s6">Open to work <b>/ 2026</b></span>'],
    ['07','Underline','Plain text, amber rule','<span class="s s7">Open to opportunities</span>'],
    ['08','Bracket tag','Index-style brackets','<span class="s s8">Open to opportunities</span>'],
  ];
  document.getElementById('root').innerHTML = OPTS.map(([n,name,desc,html])=>`
    <div class="opt">
      <div class="opt__bar"><span class="opt__n">${n}</span><span class="opt__name">${name}</span><span class="opt__desc">${desc}</span></div>
      <div class="eyebrow">
        <span class="mono blue">( Good afternoon )</span>
        <span class="mono">5 Years · Product Design</span>
        ${html}
      </div>
    </div>`).join('');
</script>
</body>
</html>
